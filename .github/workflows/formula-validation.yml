name: Formula template validation

on:
  pull_request:
    paths:
      - "formula/**"
      - "src/tariff_catalogue/review/formula_validation.py"
      - ".github/workflows/formula-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Validate formula templates
        run: PYTHONPATH=src python -m tariff_catalogue.review.formula_validation
