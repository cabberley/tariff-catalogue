name: Community plan intake

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: community-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  process-submission:
    if: >-
      github.event.label.name == 'plan-submission' ||
      (github.event.action == 'opened' && startsWith(github.event.issue.title, '[Plan submission]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Validate and open a review PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          CATALOGUE_BASE_URL: ${{ vars.CATALOGUE_BASE_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m tariff_catalogue.community_tools.intake process
