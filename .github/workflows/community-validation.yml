name: Community plan validation

on:
  pull_request:
    paths:
      - "community/**"
      - "src/tariff_catalogue/community_tools/**"
      - ".github/workflows/community-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Validate plans and report synthetic bill findings
        env:
          CATALOGUE_BASE_URL: ${{ vars.CATALOGUE_BASE_URL }}
        run: python -m tariff_catalogue.community_tools.intake validate-community
