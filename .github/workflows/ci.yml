name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest

  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare schema with tariff-core
        run: |
          curl --fail --silent --show-error \
            https://raw.githubusercontent.com/cabberley/tariff-core/main/docs/schema.md \
            --output /tmp/tariff-core-schema.md
          tail -n +3 docs/schema.md > /tmp/catalogue-schema.md
          cp /tmp/tariff-core-schema.md /tmp/upstream-schema.md
          diff --unified /tmp/upstream-schema.md /tmp/catalogue-schema.md

  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
